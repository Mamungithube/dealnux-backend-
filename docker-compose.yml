services:
  web:
    build: .
    container_name: dealnux_web
    command: gunicorn dealnux.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    links:
      - redis

  db:
    image: postgres:16
    container_name: dealnux_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:alpine
    container_name: dealnux_redis
    restart: always
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    container_name: dealnux_celery_worker
    command: celery -A dealnux worker -l info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: dealnux_celery_beat
    command: celery -A dealnux beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis


volumes:
  postgres_data: