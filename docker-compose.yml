services:
  web:
    build:
      context: .
      cache_from:
        - dealnux-backend
    image: dealnux-backend
    container_name: dealnux_web
    command: gunicorn dealnux.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30
    volumes:
      - .:/app
      - ./secrets:/app/secrets
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - default
      - dealnux_network
  db:
    image: postgres:16
    container_name: dealnux_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  redis:
    image: redis:alpine
    container_name: dealnux_redis
    restart: always
    ports:
      - "6379:6379"
  celery_worker:
    image: dealnux-backend
    container_name: dealnux_celery_worker
    restart: always
    command: celery -A dealnux worker -l info --concurrency=4 --max-tasks-per-child=100 -Q celery --time-limit=300 --soft-time-limit=240
    volumes:
      - .:/app
      - ./secrets:/app/secrets
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
  celery_beat:
    image: dealnux-backend
    container_name: dealnux_celery_beat
    restart: always
    command: celery -A dealnux beat -l info
    volumes:
      - .:/app
      - ./secrets:/app/secrets
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
volumes:
  postgres_data:

networks:
  default: {}
  dealnux_network:
    external: true
